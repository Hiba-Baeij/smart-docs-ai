# Production stack for Coolify (Build Pack: Docker Compose, file: /docker-compose.coolify.yml).
# Assign the public domain to the `web` service only (port 80). The API and the database stay
# on the private network. SERVICE_PASSWORD_* values are generated by Coolify on first deploy.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartdocs
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: smartdocs
    volumes:
      - smartdocs-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartdocs -d smartdocs"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://smartdocs:${SERVICE_PASSWORD_POSTGRES}@db:5432/smartdocs
      JWT_SECRET: ${SERVICE_PASSWORD_64_JWT}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      COOKIE_SECURE: "true"
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
      # The exact public origin, e.g. https://docs.example.com (no trailing slash).
      CORS_ORIGIN: ${CORS_ORIGIN:?}
      LLM_PROVIDER: openai
      LLM_BASE_URL: ${LLM_BASE_URL:?}
      LLM_API_KEY: ${LLM_API_KEY:?}
      LLM_MODEL: ${LLM_MODEL:?}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      ERROR_LOG_DIR: logs
    volumes:
      # chat-errors.log and upload-errors.log survive redeploys.
      - smartdocs-logs:/app/apps/api/logs

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  smartdocs-db:
  smartdocs-logs:
