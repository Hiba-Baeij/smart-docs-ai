<app-auth-layout heading="auth.login.heading" subtitle="auth.login.subtitle">
  @if (justRegistered) {
    <p class="notice" role="status">{{ locale.t('auth.register.success') }}</p>
  }

  @if (sessionExpired) {
    <p class="notice" role="status">{{ locale.t('auth.session.expired') }}</p>
  }

  @if (signOutFailed) {
    <p class="alert" role="alert">{{ locale.t('auth.signOut.failed') }}</p>
  }

  <app-form [form]="form" submitLabel="auth.login.action" pendingLabel="auth.login.pending">
    <app-field name="email" label="auth.email" type="email" autocomplete="username" />
    <app-field
      name="password"
      label="auth.password"
      type="password"
      autocomplete="current-password"
    />
  </app-form>

  <p class="switch">
    {{ locale.t('auth.login.switch') }}
    <a routerLink="/register">{{ locale.t('auth.register.action') }}</a>
  </p>
</app-auth-layout>
