<app-auth-layout heading="auth.register.heading" subtitle="auth.register.subtitle">
  <app-form [form]="form" submitLabel="auth.register.action" pendingLabel="auth.register.pending">
    <app-field name="name" label="auth.name" autocomplete="name" />
    <app-field name="email" label="auth.email" type="email" autocomplete="email" />
    <app-field
      name="password"
      label="auth.password"
      type="password"
      autocomplete="new-password"
      hint="auth.password.hint"
    />
  </app-form>

  <p class="switch">
    {{ locale.t('auth.register.switch') }}
    <a routerLink="/login">{{ locale.t('auth.login.action') }}</a>
  </p>
</app-auth-layout>
