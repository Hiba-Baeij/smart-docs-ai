<app-page-header [title]="locale.t('docs.title')" />

<app-document-upload (settled)="onUploadSettled()" />

<section aria-labelledby="list-heading">
  <h2 id="list-heading">{{ locale.t('docs.yours') }}</h2>

  <app-data-table
    [rows]="rows()"
    [columns]="columns()"
    [trackBy]="byId"
    [caption]="locale.t('docs.caption')"
    [loading]="store.view() === 'loading'"
    [error]="store.error()"
    [page]="store.page()"
    [pageSize]="store.pageSize()"
    [total]="store.total()"
    [pageSizeOptions]="pageSizes"
    [actions]="actions()"
    [rowLabel]="rowName"
    [emptyMessage]="locale.t('docs.empty')"
    (pageChange)="goTo($event)"
    (pageSizeChange)="list.setPageSize($event)"
    (retry)="list.refresh()"
  >
    <app-filter-chips
      tableToolbar
      [label]="locale.t('docs.filter.label')"
      [options]="statusOptions()"
      [selected]="statusFilter()"
      (selectedChange)="setStatus($event)"
    />

    <ng-template appTableEmpty>
      @if (statusFilter()) {
        <app-empty-state
          [message]="locale.t('docs.filter.none')"
          [actionLabel]="locale.t('docs.filter.clear')"
          (action)="setStatus(null)"
        />
      } @else {
        <app-empty-state [message]="locale.t('docs.empty')" />
      }
    </ng-template>

    <ng-template appCell="name" [appCellRows]="rows()" let-row>
      <div>
        <!-- Interpolation escapes HTML: a file named "<b>x</b>.pdf" is shown as text. -->
        <a class="name" dir="auto" [routerLink]="['/documents', row.document.id]">{{ row.document.originalName }}</a>
        @if (row.note; as note) {
          <p class="note">{{ note }}</p>
        }
      </div>
    </ng-template>

    <ng-template appCell="type" [appCellRows]="rows()" let-row>
      <span class="type">
        <app-file-icon [type]="row.document.fileType" size="sm" />
        {{ row.document.fileType.toUpperCase() }}
      </span>
    </ng-template>

    <ng-template appCell="status" [appCellRows]="rows()" let-row>
      <app-status-badge [state]="row.state" />
    </ng-template>
  </app-data-table>
</section>
