<header class="shell-header">
  <a class="brand" routerLink="/documents">SmartDocs AI</a>
  <nav [attr.aria-label]="locale.t('nav.main')">
    <a routerLink="/documents" routerLinkActive="active">{{ locale.t('nav.documents') }}</a>
    <a routerLink="/chat" routerLinkActive="active">{{ locale.t('nav.chat') }}</a>
  </nav>

  <div class="account">
    <app-preferences-controls />
    @if (auth.user(); as user) {
      <app-user-menu [user]="user" [signingOut]="signOutAction.pending()" (signOut)="signOut()" />
    }
  </div>
</header>

<main class="shell-main">
  <router-outlet />
</main>
