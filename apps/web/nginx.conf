# Serves the Angular build and forwards /api/* to the private API container (same origin,
# so the session cookie and CORS_ORIGIN stay simple). See docs/ops/customer-release.md.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads are capped at 10 MB by the API; leave a little room for the multipart envelope.
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Coolify's proxy -> this nginx -> API: two hops, so TRUST_PROXY_HOPS=2.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Hashed assets can be cached for long; index.html must not be.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback for deep links such as /documents/<id>.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
